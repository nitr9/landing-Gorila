# El deploy es manual: `npm run build` y despues
# `npx netlify deploy --prod --dir=dist`.
# El repo NO esta conectado a Netlify, porque el video y el audio no van a
# Git: un build hecho por Netlify daria una landing sin material.
# Este bloque queda por si algun dia el media se mueve a un CDN externo.
[build]
  command = "npm run build"
  publish = "dist"

# SPA: cualquier ruta cae en index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad. Estaban pendientes en notas/ESTADO.md y ya no
# estaban bloqueadas: el sitio se publica en Netlify, asi que van aca.
# HSTS no hace falta, lo pone Netlify solo.
#
# La CSP esta MEDIDA contra el sitio en vivo, no copiada de una plantilla:
#
#   - default-src 'none' prohibe todo lo que no este nombrado abajo. Es lo
#     que hace que agregar un tercero de aca en mas falle a la vista, en vez
#     de entrar sin que nadie se entere.
#   - style-src lleva 'unsafe-inline' y NO es negligencia: la pagina tiene
#     70 elementos con atributo style= —son las animaciones— asi que sin eso
#     no renderiza nada. Es la unica concesion, y esta medida.
#   - fonts.googleapis.com y fonts.gstatic.com son la unica dependencia
#     externa en tiempo de ejecucion que queda. El dia que las fuentes se
#     autoalojen —tambien pendiente en ESTADO.md— estas dos lineas se borran
#     y la CSP queda sin ningun origen de terceros.
#   - img-src y media-src llevan blob: por el video y los posters.
#   - frame-ancestors 'none' hace el trabajo de X-Frame-Options; el header
#     se deja igual, por los navegadores viejos que no leen la CSP.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los assets con hash en el nombre se cachean para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video, audio e imagenes: cache largo pero revalidable
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
